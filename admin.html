<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Panel moderatora – KamyczkowyTrip</title>

  <link rel="stylesheet" href="style.css">

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    defer
  ></script>

  <script src="supabase.js" defer></script>
  <script src="admin.js" defer></script>
</head>

<body>
  <main class="page">
    <div class="brand">
      🪨 KamyczkowyTrip
    </div>

    <section class="card">
      <h1>Panel moderatora</h1>

      <p>
        Zaloguj się, aby zarządzać zgłoszeniami.
      </p>

      <div id="loginPanel">
        <label for="adminEmail">
          <strong>Adres e-mail</strong>
        </label>

        <input
          id="adminEmail"
          type="email"
          autocomplete="email"
          style="
            width:100%;
            box-sizing:border-box;
            padding:12px;
            margin-top:6px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:10px;
          "
        >

        <label for="adminPassword">
          <strong>Hasło</strong>
        </label>

        <input
          id="adminPassword"
          type="password"
          autocomplete="current-password"
          style="
            width:100%;
            box-sizing:border-box;
            padding:12px;
            margin-top:6px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:10px;
          "
        >

        <button
          id="loginButton"
          class="button"
          type="button"
        >
          🔐 Zaloguj się
        </button>
      </div>

      <div
        id="adminMessage"
        class="message"
        style="display:none;"
      ></div>

      <div
        id="moderationPanel"
        style="display:none;"
      >
        <div style="margin-bottom:20px;">

  <button id="showStonesButton" class="button" type="button">
    🪨 Kamienie
  </button>

  <button id="showSightingsButton" class="button" type="button">
    📬 Zgłoszenia
  </button>

        </div>
        <div id="stonesPanel" style="display:none;">

  <h2>🪨 Dodaj nowy kamyszek</h2>

  <label>📷 Zdjęcie</label><br>
  <input type="file" id="stonePhoto" accept="image/*">

  <br><br>

  <label>Nazwa kamyczka</label><br>
  <input type="text" id="stoneName">

  <br><br>

  <label>Miejsce narodzin</label><br>
  <input type="text" id="birthPlace">

  <br><br>

          <label>Data narodzin</label><br>
<input
  type="date"
  id="birthDate"
>

<br><br>

  <label>Kraj</label><br>
  <input type="text" id="country">

  <br><br>

  <label>Twórca</label><br>
  <input type="text" id="creatorName">

  <br><br>
          <label>Miasto</label><br>
<input type="text" id="birthCity">

<br><br>

  <label>Opis</label><br>
  <textarea id="stoneDescription" rows="4"></textarea>

  <br><br>

  <button id="createStoneButton" class="button">
    🪨 Utwórz paszport
  </button>

  <hr style="margin:30px 0;">

        </div>
        <p>
          Zalogowano jako:
          <strong id="loggedUser"></strong>
        </p>

        <button
          id="logoutButton"
          class="button"
          type="button"
        >
          Wyloguj się
        </button>

        <div id="sightingsPanel">

  <h2>Oczekujące zgłoszenia</h2>

  <div id="pendingSightings">
    Ładuję zgłoszenia…
  </div>

        </div>
      </div>
    </section>
  </main>
</body>
</html>
